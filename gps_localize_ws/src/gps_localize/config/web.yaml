# Local web UI. Open http://<robot-ip>:8080 from any phone or laptop
# on the same network.
web:
  host: 0.0.0.0                # 0.0.0.0 = reachable from the network, 127.0.0.1 = this PC only
  port: 8080
  telemetry_rate_hz: 5.0       # how often the browser is updated
  heartbeat_rate_hz: 4.0       # how often the browser must call /api/heartbeat
  max_clients: 8               # simultaneous browser streams (keeps RAM bounded)
  log_lines: 200               # event log kept in memory (bounded ring buffer)

  # Manual driving (the arrow buttons)
  manual_speed_mps: 0.18
  manual_turn_dps: 45.0
  manual_repeat_ms: 150        # browser resends the jog command while a button is held

  # Map panel
  trail_points: 300            # robot trail length, bounded on purpose
  allow_config_edit: true      # false = read-only UI (locks the Settings page)
