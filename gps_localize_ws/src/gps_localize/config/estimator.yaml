# How the robot works out where it points and how fast it is going.
# This robot has no wheel encoders, so several sensors are combined and the
# best healthy one is used - see docs/architecture.md.
estimator:
  # 0 = BNO085 magnetometer only
  # 1 = IMU gyro + GPS course only (relative until the robot moves)
  # 2 = GPS course only
  # 3 = IMU gyro + compass when still + GPS when moving
  # 4 = AUTO, health checked, falls back on its own          <- recommended
  heading_source: 4

  align_min_mps: 0.25       # trust the GPS course only above this speed
  align_tau_s: 6.0          # how fast the heading is pulled onto the GPS course
  gps_tau_s: 1.5            # GPS speed pull-in for the speed estimate
  model_tau_s: 2.5          # fallback pull-in when the fix is lost
  track_m: 0.30             # splits body speed into left/right wheel speed

  # QMC5883L compass inside the GPS module - this is what gives the robot an
  # absolute heading while standing still, before the first move.
  mag_enable: true
  mag_tau_s: 4.0            # how fast the heading is pulled onto the compass when stopped
  mag_still_mps: 0.10       # below this speed the compass is used
  mag_declination_deg: 0.6  # magnetic declination for your area (Bangkok ~ +0.6)
  mag_mount_offset_deg: 0.0 # squares the GPS module to the front of the robot
