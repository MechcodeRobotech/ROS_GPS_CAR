# Motors: how hard they are allowed to accelerate, and the electrical model
# used to read wheel speed out of the INA226 voltage and current.
# Saved from the web UI -> pushed to the firmware immediately.
motor:
  # Acceleration ramp, applied to the PWM that actually reaches the driver.
  # Bigger = gentler start, less current draw, less gearbox shock.
  # An emergency stop ignores the ramp and cuts the motors at once.
  accel_ramp_s: 0.6         # seconds from stopped to full power
  decel_ramp_s: 0.3         # seconds back down to zero

  # Wheel speed from back-EMF:  rpm = ((V_bus - V_diode) * duty - I * R) / Ke
  # Needs no encoder, notices load, and spots a blocked wheel or a broken
  # motor wire. How to measure Ke and R: docs/tuning.md 4c.
  ke_v_per_rpm: 0.12        # 12 V / 100 rpm output shaft (JGA25-370-100RPM)
  resistance_ohm: 5.0       # motor winding + TB6612 + wiring - measure yours
  stall_current_a: 0.9      # this much current with no back-EMF = blocked wheel

  # Series diode between each INA226 and its TB6612 (schematic draft_5).
  # The sensor reads the rail BEFORE the diode, so this drop has to come off.
  # Each motor has its own diode - they can be different parts.
  #   Schottky (SS34, 1N5822) ~0.35-0.50 V   standard (1N4007) ~0.8-1.0 V
  # MEASURED on this robot with a meter across each diode, not a datasheet
  # figure. The host pushes these to the board on every reconnect, so a stale
  # value here silently overwrites a good one on the board.
  diode_a_vf_v: 0.181       # motor A forward drop at working current
  diode_a_r_ohm: 0.03       # motor A slope resistance (0 = flat drop)
  diode_b_vf_v: 0.168       # motor B
  diode_b_r_ohm: 0.03
